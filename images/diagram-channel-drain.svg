<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="'Public Sans', system-ui, sans-serif">
  <title id="t">How a channel drain works</title>
  <desc id="d">Cutaway of a driveway sloping toward a garage. Rain runs down the driveway and drops through a flush grate into a channel drain set in the concrete. A buried pipe carries the water to an outlet before it reaches the garage.</desc>
  <defs>
    <pattern id="soil" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#E6D6B3"/>
      <circle cx="8" cy="10" r="1.6" fill="#CDB88C"/><circle cx="28" cy="6" r="1.2" fill="#CDB88C"/>
      <circle cx="20" cy="24" r="1.4" fill="#D2BF96"/><circle cx="34" cy="32" r="1.6" fill="#CDB88C"/>
    </pattern>
    <pattern id="conc" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#D9DAD4"/>
      <circle cx="7" cy="8" r="1.3" fill="#B9BAB3"/><circle cx="21" cy="19" r="1.1" fill="#B9BAB3"/><circle cx="13" cy="25" r=".9" fill="#C6C7C0"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2F7FC1"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#0E3B2C"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#F7F8F3"/>

  <!-- rain -->
  <g stroke="#2F7FC1" stroke-width="2.5" stroke-linecap="round" opacity=".55">
    <path d="M90 40 l-8 22"/><path d="M180 70 l-8 22"/><path d="M270 36 l-8 22"/><path d="M360 64 l-8 22"/>
    <path d="M450 40 l-8 22"/><path d="M540 72 l-8 22"/><path d="M140 120 l-8 22"/><path d="M320 126 l-8 22"/><path d="M480 120 l-8 22"/>
  </g>

  <!-- garage -->
  <rect x="740" y="60" width="220" height="250" fill="#FFFFFF" stroke="#0E3B2C" stroke-width="3"/>
  <path d="M726 64 L850 10 L974 64 Z" fill="#0E3B2C"/>
  <rect x="772" y="140" width="160" height="170" fill="#E8EFE3" stroke="#0E3B2C" stroke-width="2"/>
  <g stroke="#B9CDBF" stroke-width="2"><path d="M772 174 h160"/><path d="M772 208 h160"/><path d="M772 242 h160"/><path d="M772 276 h160"/></g>
  <text x="852" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0E3B2C">GARAGE</text>

  <!-- ground -->
  <path d="M0 210 L740 310 L960 310 L960 600 L0 600 Z" fill="url(#soil)"/>
  <!-- driveway slab sloping toward garage -->
  <path d="M0 196 L740 296 L740 322 L0 222 Z" fill="url(#conc)" stroke="#8E8F88" stroke-width="2"/>

  <!-- channel drain cut into slab near garage -->
  <g>
    <path d="M626 266 L666 272 L666 342 Q646 352 626 340 Z" fill="#5E6A64" stroke="#0E3B2C" stroke-width="2.5"/>
    <path d="M630 282 L662 287 L662 336 Q646 344 630 334 Z" fill="#2F7FC1" opacity=".35"/>
    <!-- grate -->
    <path d="M622 265 L670 272" stroke="#15211B" stroke-width="7"/>
    <g stroke="#F7F8F3" stroke-width="2"><path d="M630 265 v5"/><path d="M640 266 v5"/><path d="M650 268 v5"/><path d="M660 269 v5"/></g>
  </g>

  <!-- outlet pipe from bottom of channel -->
  <path d="M646 344 Q640 420 560 440 L0 474" stroke="#3A7D5A" stroke-width="16" fill="none" stroke-linecap="round"/>


  <!-- water sheeting down driveway -->
  <g stroke="#2F7FC1" stroke-width="3.5" fill="none" marker-end="url(#arw)">
    <path d="M140 202 L330 228"/><path d="M380 236 L560 260"/>
  </g>
  <path d="M600 262 Q630 262 640 290" stroke="#2F7FC1" stroke-width="3.5" fill="none" marker-end="url(#arw)"/>
  <!-- flow in pipe -->
  <path d="M520 448 L40 475" stroke="#2F7FC1" stroke-width="3" fill="none" marker-end="url(#arw)"/>

  <!-- blocked: no water at garage -->
  <g transform="translate(790 345)">
    <circle r="16" fill="#FFFFFF" stroke="#1F6B4E" stroke-width="3"/>
    <path d="M-7 0 l5 5 9 -10" stroke="#1F6B4E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- labels -->
  <g font-size="17" fill="#15211B">
    <g stroke="#0E3B2C" stroke-width="1.5" fill="none" marker-start="url(#dot)">
      <path d="M200 208 L200 126 L222 126"/>
      <path d="M646 268 L646 180 L620 180"/>
      <path d="M664 320 L700 420"/>
      <path d="M400 452 L400 500"/>
    </g>
    <text x="230" y="120" font-weight="700">Driveway slopes toward the garage</text>
    <text x="230" y="140" font-size="15" fill="#4A5A51">Rain sheets down the concrete</text>

    <text x="612" y="168" text-anchor="end" font-weight="700">Flush grate</text>
    <text x="612" y="188" text-anchor="end" font-size="15" fill="#4A5A51">Rated for car traffic</text>

    <text x="708" y="434" font-weight="700">Channel body</text>
    <text x="708" y="454" font-size="15" fill="#4A5A51">Catches the full width</text>

    <text x="300" y="520" font-weight="700">Buried pipe to an outlet</text>
    <text x="300" y="540" font-size="15" fill="#4A5A51">Swale, street where allowed, or dry well</text>

    <text x="814" y="351" font-size="15" font-weight="700" fill="#1F6B4E">Garage stays dry</text>
  </g>

  <text x="24" y="584" font-size="14" font-weight="700" fill="#1F6B4E" letter-spacing="1.5">KEENUM LAWNCARE · HOW A CHANNEL DRAIN WORKS</text>
</svg>
