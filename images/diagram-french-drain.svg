<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="'Public Sans', system-ui, sans-serif">
  <title id="t">How a French drain works</title>
  <desc id="d">Cutaway of a yard beside a house. Rain soaks into a gravel-filled trench lined with filter fabric. A perforated pipe at the bottom slopes away from the house and carries the water to an outlet at a swale.</desc>
  <defs>
    <pattern id="gravel" width="26" height="22" patternUnits="userSpaceOnUse">
      <rect width="26" height="22" fill="#B9B4A8"/>
      <ellipse cx="6" cy="6" rx="5" ry="4" fill="#D6D2C8" stroke="#8E897E" stroke-width="1"/>
      <ellipse cx="18" cy="8" rx="6" ry="4.5" fill="#CBC6BB" stroke="#8E897E" stroke-width="1"/>
      <ellipse cx="11" cy="17" rx="5.5" ry="4" fill="#E0DCD3" stroke="#8E897E" stroke-width="1"/>
      <ellipse cx="23" cy="19" rx="4" ry="3" fill="#C4BFB3" stroke="#8E897E" stroke-width="1"/>
    </pattern>
    <pattern id="soil" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#E6D6B3"/>
      <circle cx="8" cy="10" r="1.6" fill="#CDB88C"/><circle cx="28" cy="6" r="1.2" fill="#CDB88C"/>
      <circle cx="20" cy="24" r="1.4" fill="#D2BF96"/><circle cx="34" cy="32" r="1.6" fill="#CDB88C"/>
      <circle cx="6" cy="34" r="1.1" fill="#D2BF96"/>
    </pattern>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2F7FC1"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#0E3B2C"/>
    </marker>
  </defs>

  <!-- sky -->
  <rect width="960" height="600" fill="#F7F8F3"/>

  <!-- rain -->
  <g stroke="#2F7FC1" stroke-width="2.5" stroke-linecap="round" opacity=".55">
    <path d="M250 40 l-8 22"/><path d="M320 60 l-8 22"/><path d="M400 34 l-8 22"/><path d="M470 66 l-8 22"/>
    <path d="M540 40 l-8 22"/><path d="M610 70 l-8 22"/><path d="M690 44 l-8 22"/><path d="M290 110 l-8 22"/>
    <path d="M440 120 l-8 22"/><path d="M580 116 l-8 22"/><path d="M720 112 l-8 22"/><path d="M370 150 l-8 22"/>
  </g>

  <!-- house -->
  <rect x="0" y="70" width="150" height="160" fill="#FFFFFF" stroke="#0E3B2C" stroke-width="3"/>
  <path d="M-10 74 L75 20 L170 74 Z" fill="#0E3B2C"/>
  <rect x="40" y="120" width="44" height="40" fill="#E8EFE3" stroke="#0E3B2C" stroke-width="2"/>
  <text x="75" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#0E3B2C">HOUSE</text>

  <!-- soil body with swale on the right -->
  <path d="M0 230 L760 250 Q830 300 900 262 L960 258 L960 600 L0 600 Z" fill="url(#soil)"/>

  <!-- trench: sloping down from house toward outlet -->
  <path d="M190 232 L740 248 L740 372 L190 330 Z" fill="url(#gravel)"/>
  <!-- filter fabric -->
  <path d="M190 232 L190 330 L740 372 L740 248" fill="none" stroke="#0E3B2C" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- perforated pipe -->
  <path d="M200 312 L760 354" stroke="#3A7D5A" stroke-width="18" stroke-linecap="round"/>
  <g fill="#0E3B2C">
    <circle cx="240" cy="315" r="2.6"/><circle cx="290" cy="319" r="2.6"/><circle cx="340" cy="323" r="2.6"/>
    <circle cx="390" cy="326" r="2.6"/><circle cx="440" cy="330" r="2.6"/><circle cx="490" cy="334" r="2.6"/>
    <circle cx="540" cy="338" r="2.6"/><circle cx="590" cy="342" r="2.6"/><circle cx="640" cy="345" r="2.6"/>
    <circle cx="690" cy="349" r="2.6"/>
  </g>
  <!-- pipe daylights at the swale -->
  <path d="M760 354 Q806 344 818 284" stroke="#3A7D5A" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- grass on top -->
  <path d="M150 230 L760 250" stroke="#5DBB63" stroke-width="9" stroke-linecap="round"/>
  <path d="M760 250 Q830 300 900 262 L960 258" stroke="#5DBB63" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- water soaking down into gravel -->
  <g stroke="#2F7FC1" stroke-width="3" fill="none" marker-end="url(#arw)">
    <path d="M300 210 v62"/><path d="M430 214 v66"/><path d="M560 218 v70"/>
  </g>
  <!-- water flowing in pipe -->
  <path d="M330 290 L660 315" stroke="#2F7FC1" stroke-width="3.5" fill="none" marker-end="url(#arw)"/>
  <!-- water out at swale -->
  <g fill="#2F7FC1" opacity=".75">
    <path d="M818 286 q14 6 24 0 q-12 14 -24 0z"/>
  </g>
  <path d="M838 292 Q860 300 880 286" stroke="#2F7FC1" stroke-width="3" fill="none" marker-end="url(#arw)"/>

  <!-- labels -->
  <g font-size="17" fill="#15211B">
    <g stroke="#0E3B2C" stroke-width="1.5" fill="none" marker-start="url(#dot)">
      <path d="M470 242 L470 186 L500 186" />
      <path d="M190 300 L190 440" />
      <path d="M520 316 L520 470" />
      <path d="M600 345 L600 520" />
      <path d="M845 280 L845 200" />
      <path d="M700 356 L700 420 L760 420" />
    </g>
    <text x="508" y="180" font-weight="700">Sod, mulch or rock on top</text>
    <text x="508" y="200" font-size="15" fill="#4A5A51">Disappears into the yard</text>

    <text x="120" y="462" font-weight="700">Filter fabric</text>
    <text x="120" y="482" font-size="15" fill="#4A5A51">Keeps sandy soil out</text>

    <text x="420" y="492" font-weight="700">Clean gravel</text>
    <text x="420" y="512" font-size="15" fill="#4A5A51">Water soaks in fast</text>

    <text x="560" y="542" font-weight="700">Perforated pipe</text>
    <text x="560" y="562" font-size="15" fill="#4A5A51">Collects water through the holes</text>

    <text x="845" y="168" text-anchor="middle" font-weight="700">Outlet</text>
    <text x="845" y="188" text-anchor="middle" font-size="15" fill="#4A5A51">Swale, street or dry well</text>

    <text x="768" y="416" font-weight="700">Slopes downhill</text>
    <text x="768" y="436" font-size="15" fill="#4A5A51">Gravity does the work</text>
  </g>

  <!-- footer tag -->
  <text x="24" y="584" font-size="14" font-weight="700" fill="#1F6B4E" letter-spacing="1.5">KEENUM LAWNCARE · HOW A FRENCH DRAIN WORKS</text>
</svg>
